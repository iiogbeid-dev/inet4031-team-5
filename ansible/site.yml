---
- name: Baseline environment setup
  hosts: local
  become: true

  tasks:
    - name: Ensure baseline packages are installed
      dnf:
        name:
          - git
          - curl
          - wget
        state: present

name: Deploy application stack
  hosts: localhost
  connection: local
  become: yes

  roles:
    - app-stack

    - name: Set up k3d cluster
  hosts: localhost
  connection: local
  become: yes
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  roles:
    - k3d-setup

