name: Scheduled Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install restic
        run: sudo apt-get install -y restic

      - name: Verify repository and prune old snapshots
        env:
          RESTIC_REPOSITORY: $s3:http://localhost:9305/backups
          RESTIC_PASSWORD: $frhphHSOP7nFTaxBkgMHftu5hm6sJKUH
          AWS_ACCESS_KEY_ID: $backup
          AWS_SECRET_ACCESS_KEY: $GMn2Ksm6nl4crzMRQgOmC/Vui92Ubnad
        run: |
          restic snapshots
          restic forget --prune --keep-daily 7 --keep-weekly 4 --keep-monthly 3
